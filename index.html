  <!-- Aplica o tema salvo antes da primeira pintura, para a tela não piscar.
       Fica inline de propósito: o React só monta depois que o HTML já foi
       desenhado, e a esse ponto a troca de tema seria visível. -->
  <script>
    (function () {
      document.documentElement.classList.add('js');
      try {
        var salvo = localStorage.getItem('cidades-ma-tema');
        if (salvo === 'claro' || salvo === 'escuro') {
          document.documentElement.setAttribute('data-tema', salvo);
        }
      } catch (e) { /* navegação privativa: segue a preferência do sistema */ }
    })();
  </script>
</head>
<body>
  <div id="raiz"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
